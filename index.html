<html>
    <head>
        <link rel="stylesheet" href="index.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Agdasima:wght@400;700&family=Yuyu&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="container">
            <div class="div1">
                <h3 contenteditable="">HOME</h3>
                <h2 id="home-score">0</h2>
                <div>
                    <button id="home-score-btn-1" onclick="addOneHome()">+1</button>
                    <button id="home-score-btn-2" onclick="addTwoHome()">+2</button>
                    <button id="home-score-btn-3" onclick="addThreeHome()">+3</button>
                    <br>
                    <button id="home-score-btn-1-" onclick="minusOneHome()">-1</button>
                    <button id="home-score-btn-2-" onclick="minusTwoHome()">-2</button>
                    <button id="home-score-btn-3-" onclick="minusThreeHome()">-3</button>
                    <br>
                    <button id="home-start-over" onclick="startOverAgain()">Start Over 🔄</button>
                </div>
            </div>
            <div class="div2">
                <h3 contenteditable="">AWAY</h3>
                <h2 id="guest-score">0</h2>
                <div>
                    <button id="guest-score-btn-1" onclick="addOneGuest()">+1</button>
                    <button id="guest-score-btn-2" onclick="addTwoGuest()">+2</button>
                    <button id="guest-score-btn-3" onclick="addThreeGuest()">+3</button>
                    <br>
                    <button id="guest-score-btn-1-" onclick="minusOneGuest()">-1</button>
                    <button id="guest-score-btn-2-" onclick="minusTwoGuest()">-2</button>
                    <button id="guest-score-btn-3-" onclick="minusThreeGuest()">-3</button>
                </div>
            </div>
        </div>
        <script src="index.js"></script>
    </body>
</html>
